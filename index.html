/* =========================================================

function supabaseHeaders(){

    return {

        "apikey": SUPABASE_KEY,

        "Authorization":
            "Bearer " + SUPABASE_KEY,

        "Content-Type":
            "application/json",

        "Accept":
            "application/json"

    };

}


/* =========================================================
   SUPABASE REQUEST
   ========================================================= */

async function supabaseFetch(
    url,
    options = {}
){

    const response =
        await fetch(
            url,
            {

                ...options,

                headers:{
                    ...supabaseHeaders(),
                    ...(options.headers || {})
                }

            }
        );


    if(!response.ok){

        const errorText =
            await response.text();

        console.error(
            "Supabase error:",
            response.status,
            errorText
        );

        throw new Error(
            "Supabase fout " +
            response.status +
            ": " +
            errorText
        );

    }


    const text =
        await response.text();


    if(!text){

        return null;

    }


    try{

        return JSON.parse(text);

    }catch{

        return text;

    }

}

/* =========================================================
   TIJD OMZETTEN
   ========================================================= */

function formatTime(
    value
){

    if(!value){

        return "";

    }


    /*
       Als Supabase alleen HH:MM teruggeeft
    */

    if(
        /^\d{2}:\d{2}$/.test(
            String(value)
        )
    ){

        return String(value);

    }


    const date =
        new Date(value);


    if(
        isNaN(
            date.getTime()
        )
    ){

        return String(value)
            .slice(0,5);

    }


    return date
        .toLocaleTimeString(
            "nl-NL",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );

}

/* =========================================================
   DATETIME MAKEN
   ========================================================= */

function createReservationDateTime(
    time
){

    const now =
        new Date();


    const [
        hours,
        minutes
    ] =
        time.split(":");


    now.setHours(
        Number(hours),
        Number(minutes),
        0,
        0
    );


    /*
       Supabase krijgt ISO datum/tijd.
    */

    return now.toISOString();

}
