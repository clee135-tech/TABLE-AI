<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TABLE — Restaurant Dashboard</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--text:#161616;--muted:#6b6b73;--line:#e8e8ec;--accent:#111}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}
header{padding:28px max(20px,calc((100% - 1150px)/2));display:flex;justify-content:space-between;align-items:center;background:#fff;border-bottom:1px solid var(--line)}
.logo{font-size:28px;font-weight:900;letter-spacing:-1px}.date{color:var(--muted);font-size:14px}
main{max-width:1150px;margin:28px auto;padding:0 20px}.hero{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:22px}
h1{font-size:38px;letter-spacing:-1.5px;margin:0 0 6px}.sub{color:var(--muted)}
button{border:0;background:var(--accent);color:#fff;padding:12px 17px;border-radius:12px;font-weight:700;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}.label{color:var(--muted);font-size:13px}.value{font-size:30px;font-weight:850;margin-top:7px}.green{color:#16803c}
.section{margin-top:18px;display:grid;grid-template-columns:1.4fr .9fr;gap:18px}.title{font-size:19px;font-weight:800;margin-bottom:15px}
.bars{display:flex;align-items:end;gap:12px;height:220px;padding:10px 0 0}.barwrap{flex:1;height:100%;display:flex;flex-direction:column;justify-content:end;align-items:center;gap:7px}.bar{width:100%;max-width:55px;border-radius:9px 9px 4px 4px;background:#111}.barwrap small{color:var(--muted)}
.tip{padding:15px;border:1px solid var(--line);border-radius:14px;margin-bottom:10px}.tip strong{display:block;margin-bottom:5px}.tip span{color:var(--muted);font-size:14px}
.tables{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.table{border:1px solid var(--line);border-radius:14px;padding:15px;text-align:center}.dot{width:12px;height:12px;border-radius:50%;display:inline-block;margin-right:6px;background:#22a559}.busy .dot{background:#e5a100}.empty .dot{background:#bbb}
.modal{display:none;position:fixed;inset:0;background:#0007;place-items:center;padding:20px}.modalbox{background:#fff;padding:25px;border-radius:18px;width:min(430px,100%)}input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;margin:7px 0 14px} 
@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.section{grid-template-columns:1fr}.tables{grid-template-columns:repeat(2,1fr)}.hero{align-items:start;flex-direction:column}h1{font-size:31px}}
</style>
</head>
<body>
<header><div class="logo">TABLE</div><div class="date" id="today"></div></header>
<main>
<section class="hero">
<div><h1>Goedenavond 👋</h1><div class="sub">Hier is wat er vandaag in je restaurant gebeurt.</div></div>
<button onclick="openModal()">＋ Reservering</button>
</section>

<section class="grid">
<div class="card"><div class="label">Bezetting vanavond</div><div class="value" id="occupancy">0%</div></div>
<div class="card"><div class="label">Reserveringen</div><div class="value" id="bookings">0</div></div>
<div class="card"><div class="label">Beschikbare stoelen</div><div class="value" id="seats">0</div></div>
<div class="card"><div class="label">TABLE-score</div><div class="value green">100/100</div></div>
</section>

<section class="section">
<div class="card"><div class="title">Verwachte bezetting</div><div class="bars" id="bars"></div></div>
<div class="card"><div class="title">TABLE adviseert</div>
<div class="tip"><strong>🟢 Systeem Live</strong><span>Gekoppeld met je Supabase cloud database.</span></div>
</div>
</section>

<section class="card" style="margin-top:18px"><div class="title">Tafeloverzicht</div><div class="tables" id="tables"></div></section>
</main>

<div class="modal" id="modal"><div class="modalbox"><h2>Nieuwe reservering</h2>
<label>Naam</label><input id="name" placeholder="Bijv. Emma">
<label>Aantal personen</label><select id="people"><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select>
<label>Tijd</label><input id="time" type="time" value="20:30">
<button onclick="addBooking()">Toevoegen</button>
<button onclick="closeModal()" style="background:#eee;color:#111;margin-left:6px">Annuleren</button>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://nrfjhxoadepdhlmqfmls.supabase.co";
  const SUPABASE_KEY = "sb_publishable_G52O2xPyZg4bhAYLj-we7A_Z-efjDeb";
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  document.getElementById('today').textContent = new Intl.DateTimeFormat('nl-NL', {weekday: 'long', day: 'numeric', month: 'long'}).format(new Date());

  // Deze functie haalt alles live op uit Supabase en zet het op het scherm
  async function loadLiveDashboard() {
    // 1. Haal live tafels op
    const { data: tafels, error: tafelFout } = await supabaseClient.from("restaurant_tables").select("*").order('name');
    // 2. Haal live reserveringen op
    const { data: reserveringen, error: reserFout } = await supabaseClient.from("reservations").select("*");

    if (tafelFout || reserFout) {
      console.error("Fout bij ophalen data:", tafelFout || reserFout);
      return;
    }

    // Update de reserveringsteller op het dashboard
    document.getElementById('bookings').textContent = reserveringen.length;

    // Bereken totale stoelen en beschikbare stoelen
    let totaalStoelen = 0;
    tafels.forEach(t => totaalStoelen += t.seats);
    document.getElementById('seats').textContent = totaalStoelen;

    // Teken de tafels live op het scherm
    document.getElementById('tables').innerHTML = tafels.map(t => {
      // Controleer of deze tafel bezet is door een reservering
      const isBezet = reserveringen.some(r => r.table_id === t.id);
      let statusTekst = isBezet ? 'Gereserveerd' : 'Vrij';
      let statusKlasse = isBezet ? 'busy' : 'empty';

      return `<div class="table ${statusKlasse}"><div><span class="dot"></span>${statusTekst}</div><strong>${t.name}</strong><br><small style="color:var(--muted)">${t.seats} stoelen</small></div>`;
    }).join('');

    // Vaste balken grafiek voor de uren
    const vals =;
    document.getElementById('bars').innerHTML = vals.map((v, i) => `<div class="barwrap"><div class="bar" style="height:${v * 1.75}px" title="${v}%"></div><small>${17 + i}:00</small></div>`).join('');
  }

  function openModal() { document.getElementById('modal').style.display = 'grid' }
  function closeModal() { document.getElementById('modal').style.display = 'none' }

  // Voegt een reservering toe en stuurt deze DIRECT naar Supabase
  async function addBooking() {
    const klantNaam = document.getElementById('name').value.trim();
    const aantalPersonen = parseInt(document.getElementById('people').value);
    const tijd = document.getElementById('time').value;

    if (!klantNaam) {
      alert('Vul een naam in.');
      return;
    }

    // Maak een geldige ISO tijdstempel voor vandaag met de gekozen tijd
    const vandaag = new Date().toISOString().split('T')[0];
    const tijdstip = `${vandaag}T${tijd}:00Z`;

    // Eerst zoeken we een vrije tafel die genoeg stoelen heeft
    const { data: tafels } = await supabaseClient.from("restaurant_tables").select("*");
    const { data: reserveringen } = await supabaseClient.from("reservations").select("*");
    
    // Filter tafels die nog GEEN reservering hebben en genoeg stoelen hebben
    const vrijeTafel = tafels.find(t => t.seats >= aantalPersonen && !reserveringen.some(r => r.table_id === t.id));

    const gekoppeldeTafelId = vrijeTafel ? vrijeTafel.id : null;

    // Stuur de reservering naar Supabase
    const { error } = await supabaseClient
      .from("reservations")
      .insert({
        restaurant_id: 1,
        table_id: gekoppeldeTafelId,
        customer_name: klantNaam,
        people: aantalPersonen,
        reservation_time: tijdstip
      });

    if (error) {
      alert("Fout bij opslaan: " + error.message);
      return;
    }

    closeModal();.
    // Wis de invoervelden
    document.getElementById('name').value = '';
    
    // Herlaad direct het dashboard zodat je de nieuwe reservering live ziet!
    loadLiveDashboard();
  }

  // Start het live dashboard direct op zodra de pagina opent
  loadLiveDashboard();
</script>
</body>
</html>
